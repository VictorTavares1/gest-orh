<mat-sidenav-container class="shell-container">

  <mat-sidenav class="shell-sidenav" [opened]="sidenavOpen()" mode="side">

    <div class="sidenav-header">
      <div class="header-icon">
        <mat-icon>corporate_fare</mat-icon>
      </div>
      <div class="header-text">
        <span class="brand-name">Gestão RH</span>
        <span class="brand-sub">v1.0</span>
      </div>
    </div>

    <p class="nav-section-label">Menu</p>

    <mat-nav-list>
      <mat-list-item routerLink="/dashboard" routerLinkActive="active-link">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </mat-list-item>

      <mat-list-item routerLink="/pedidos" routerLinkActive="active-link">
        <mat-icon matListItemIcon>assignment</mat-icon>
        <span matListItemTitle>Os Meus Pedidos</span>
      </mat-list-item>

      <mat-list-item routerLink="/pedidos/novo" routerLinkActive="active-link">
        <mat-icon matListItemIcon>add_circle_outline</mat-icon>
        <span matListItemTitle>Novo Pedido</span>
      </mat-list-item>

      @if (isDiretora()) {
        <mat-list-item routerLink="/aprovacoes" routerLinkActive="active-link">
          <mat-icon matListItemIcon
            [matBadge]="pendentesCount() > 0 ? pendentesCount() : null"
            matBadgeColor="warn"
            matBadgeSize="small">
            pending_actions
          </mat-icon>
          <span matListItemTitle>Aprovações</span>
        </mat-list-item>
      }
    </mat-nav-list>

    @if (isDiretora()) {
      <mat-divider />

      <p class="nav-section-label">Administração</p>

      <mat-nav-list>
        <mat-list-item routerLink="/admin/utilizadores" routerLinkActive="active-link">
          <mat-icon matListItemIcon>manage_accounts</mat-icon>
          <span matListItemTitle>Utilizadores</span>
        </mat-list-item>
        <mat-list-item routerLink="/admin/relatorio" routerLinkActive="active-link">
          <mat-icon matListItemIcon>bar_chart</mat-icon>
          <span matListItemTitle>Relatório Mensal</span>
        </mat-list-item>
      </mat-nav-list>
    }

  </mat-sidenav>

  <mat-sidenav-content class="shell-content">

    <mat-toolbar class="shell-toolbar">
      <button mat-icon-button (click)="sidenavOpen.set(!sidenavOpen())">
        <mat-icon>menu</mat-icon>
      </button>

      <span class="toolbar-spacer"></span>

      <button mat-button [matMenuTriggerFor]="userMenu" class="user-btn">
        <mat-icon>account_circle</mat-icon>
        <span>{{ auth.utilizador()?.nome ?? 'Utilizador' }}</span>
        <mat-icon>arrow_drop_down</mat-icon>
      </button>

      <mat-menu #userMenu="matMenu">
        <button mat-menu-item disabled>
          <mat-icon>badge</mat-icon>
          <span>{{ auth.utilizador()?.roles?.[0] ?? '' }}</span>
        </button>
        <mat-divider />
        <button mat-menu-item routerLink="/perfil">
          <mat-icon>manage_accounts</mat-icon>
          <span>O meu perfil</span>
        </button>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Terminar Sessão</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <div class="shell-body">
      <router-outlet />
    </div>

  </mat-sidenav-content>

</mat-sidenav-container>
